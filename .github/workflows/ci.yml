name: Validar aplicación

on:
  pull_request:
  push:
    branches:
      - main
      - claude/minis-diagnostic-tool-r9n1ph

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run build
        env:
          SESSION_SECRET: ci-session-secret-at-least-thirty-two-characters
          ADMIN_EMAIL: admin@ci.local
          ADMIN_PASSWORD: admin-ci-password
          CHOFER_EMAIL: chofer@ci.local
          CHOFER_PASSWORD: chofer-ci-password
      - run: npm test
